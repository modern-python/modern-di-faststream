name: checks
on:
  workflow_call: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install 3.10
      - run: uv python pin 3.10
      - run: just install lint-ci

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv python pin ${{ matrix.python-version }}
      - run: just install
      - name: Confirm the interpreter is free-threaded
        if: matrix.python-version == '3.14t'
        run: uv run --no-sync python -c "import sys, modern_di_faststream; assert not sys._is_gil_enabled(), 'GIL is enabled on a t-build'"
      - run: just test-ci

  floors:
    # The declared floors are part of what we ship, and nothing else in CI installs
    # them: `pytest` and `scheduled` both resolve highest. This leg resolves the lower
    # bound instead, on every supported interpreter: a floor's wheel coverage is
    # per-interpreter, so two interpreters resolving the same versions can still
    # disagree on whether those versions install.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv python pin ${{ matrix.python-version }}
      # --no-build: a floor with no wheel for this interpreter must fail here rather
      # than quietly compile its sdist. Without it the leg passes on a floor that
      # still breaks anyone installing into an image with no build toolchain.
      - run: uv sync --all-extras --no-install-project --resolution lowest-direct --no-build
      - run: uv run --no-sync pytest .

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # --offline blocks network requests and excludes every external URL, so this gate
      # is deterministic: it fails only on a relative link or file path a diff broke.
      # Tag-pinned and cross-repo URLs do not match the --remap pattern and stay
      # excluded: they point at trees this checkout does not have.
      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --remap
            'https://github\.com/${{ github.repository }}/(?:blob|tree)/main/(.*) file://${{ github.workspace }}/$1'
            '**/*.md'
